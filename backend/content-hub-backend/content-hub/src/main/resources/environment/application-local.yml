# Local Environment

# Spring Config
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/content_hub
    username: myuser
    password: mypassword
  jpa:
    hibernate:
      ddl-auto: update  # create, update, validate, none 중 선택/ update: DB 테이블과 엔티티 매핑정보를 비교해 변경 사항만 수정,추가
    show-sql: true # SQL 로그 출력
  flyway:
    enabled: false
  graphql:
    graphiql:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  security:
    user: 
      name: actuator
      password: "{noop}password" # 실제로는 password 를 입력
      roles: ACTUATOR

# Security Config
security:
  csrf:
    cookie:
      http-only: false
      secure: false
      same-site: Lax
      domain: ${DOMAIN:}
      path: /

# Server Config
server:
  servlet:
    session:
      cookie: # JSESSIONID 쿠키 설정
        http-only: true
        secure: false
        same-site: lax
#  port: 8080
  address: 0.0.0.0 # 모든 네트워크 인터페이스에서 외부 접속을 허용

# Log Config
logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO
        security: DEBUG
    com:
      cjy:
        contenthub: DEBUG
    # WebClient의 동작 및 요청/응답 매핑 확인 (WebClient가 Netty를 호출하는 시점)
    org.springframework.web.reactive.function.client.ExchangeFunctions: DEBUG
    # Reactor Netty의 I/O 및 스레드 동작 확인 (가장 중요)
    # 이 설정을 DEBUG 또는 TRACE로 높여야 Netty 스레드의 활동을 볼 수 있음
    reactor.netty.http.client: DEBUG
    # (선택적) 데이터가 네트워크를 통해 실제로 어떻게 전송되는지 확인 (매우 상세한 로그)
    # TRACE는 데이터 패킷까지 출력하므로 필요한 경우에만 사용
    reactor.netty.http.server.HttpServer: INFO
    # (선택적) Reactor Core의 자세한 흐름 확인
    reactor.core: INFO 

# Actuator Config
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
#        include: "*" # 모든 엔드포인트를 웹에 노출
        include: info, health, beans, conditions, metrics, env
  endpoint:
    health:
      show-details: always

# info
info:
  app:
    environment: dev

# Login Config
login:
  cookie:
    http-only: true
    secure: false
    same-site: Lax
    domain: ${DOMAIN:}
    path: /

# Application Config
app:
  url: ${APP_URL} # 프론트엔드 로컬IP:PORT번호
  cors:
    enabled: true
  actuator:
    developer-mode: true
  thread-pool:
    api-task:
      core-pool-size: 8
      max-pool-size: 32
      queue-capacity: 200
    bloking-task:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 100
