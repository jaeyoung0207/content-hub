version: '3.9'

services:
  # ===========================
  # Frontend (Nginx static server)
  # ===========================
  frontend:
    build: ./frontend/content-hub-frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-net

  # ===========================
  # Backend (Spring Boot)
  # ===========================
  backend:
    build: ./backend/content-hub-backend/content-hub
    container_name: backend
    env_file:
      - ./backend/env/.env.prod
    expose:
      - "8080"   # 내부 네트워크에서만
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

  # ===========================
  # PostgreSQL
  # ===========================
  db:
    image: postgres:17
    container_name: postgres
    env_file:
      - ./backend/env/.env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - app-net

  # ===========================
  # Redis
  # ===========================
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
