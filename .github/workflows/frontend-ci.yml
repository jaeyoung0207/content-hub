name: Frontend CI

on:
  push:
    paths:
      - "frontend/content-hub-frontend/**"
  pull_request:
    paths:
      - "frontend/content-hub-frontend/**"
  # 워크플로우를 GitHub 웹 인터페이스에서 수동으로 실행
  workflow_dispatch: 

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/content-hub-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node 셋업
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/content-hub-frontend/package-lock.json

      # 의존성 파일 설치
      - name: Install dependencies
        run: npm ci

      # enlint 실행
      - name: Run ESLint
        run: npm run lint

      # 테스트 실행
      - name: Run Tests
        run: npm run test:run  # vitest run (watch 모드 비활성화)
      
      # 빌드
      - name: Build
        run: npm run build
