name: Backend CI

on:
  push:
    paths:
      - "backend/content-hub-backend/content-hub/**"
  pull_request:
    paths:
      - "backend/content-hub-backend/content-hub/**"

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/content-hub-backend/content-hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # java 셋업
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle 캐시
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 권한 부여
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      # 빌드
      - name: Build with Gradle
        run: ./gradlew clean build --scan

      # SonarQube
      - name: Run SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.projectKey=contenthub-backend \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN
