name: Backend CI

on:
  push:
    paths:
      - "backend/content-hub-backend/content-hub/**"
  pull_request:
    paths:
      - "backend/content-hub-backend/content-hub/**"
  # 워크플로우를 GitHub 웹 인터페이스에서 수동으로 실행
  workflow_dispatch: 

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/content-hub-backend/content-hub

    steps:
      # 체크아웃
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud용 전체 히스토리

      # java 셋업
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # SonarQube 캐시
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # hashFiles는 루트 기준이므로 전체 경로 기재
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/content-hub-backend/content-hub/**/*.gradle*', 'backend/content-hub-backend/content-hub/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      # Docker Compose로 Redis 서비스 기동
      - name: Start services (Redis) via Docker Compose
        run: docker compose -f ../../../docker-compose.dev.yml up -d redis --wait

      # 권한 부여
      - name: Grant execute permission
        run: chmod +x gradlew
        
      # 빌드 (테스트 포함 및 커버리지 레포트 생성)
      - name: Build and Generate Coverage Report
        run: ./gradlew clean build jacocoTestReport -Dspring.profiles.active=test
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      # SonarQube
      - name: SonarQube Analysis
        run: ./gradlew sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }} --info
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
