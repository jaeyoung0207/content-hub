
services:
  frontend:
    ports:
      - "80:80"
      - "443:443"          # HTTPS 외부 노출
    restart: "unless-stopped"
    volumes:
       # Certbot이 ACME 챌린지(인증을 위해 웹사이트 소유권을 확인하는 과정)를 수행할 때 필요한 임시 파일들을 저장
       - /var/www/certbot:/var/www/certbot
       # Let's Encrypt에서 발급받은 실제 SSL 인증서 파일들이 저장되는 핵심 디렉토리(ro:Read Only)
       - /etc/letsencrypt:/etc/letsencrypt:ro
       # 로그 추가
       - ./logs/frontend:/var/log/nginx
  backend:
    env_file:
      - ./backend/env/.env.prod
    ports:
      #- "8080:8080"    # 메인 서비스(외부, Nginx 등에서 접근) → 필요 시에만 외부 노출
      - "8081:8081"    # Actuator 등 운영관리용
    restart: "unless-stopped"
    volumes:
      # 로그 추가
      - ./logs/backend:/app/logs
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  db:
    ports: []            # 외부 노출 제거
    restart: "unless-stopped"
  redis:
    ports: []            # 외부 노출 제거
    restart: "unless-stopped"
