          type: integer
          format: int64
        contentMediaType:
          type: string
        apiId:
          type: string
        providerId:
          type: string
        nickname:
          type: string
        starRating:
          type: number
        comment:
          type: string
        good:
          type: integer
          format: int64
        bad:
          type: integer
          format: int64
    WishlistRequestDto:
      required:
        - apiId
        - contentMediaType
        - userId
      type: object
      properties:
        userId:
          type: integer
          format: int64
        contentMediaType:
