# 프로젝트 식별 정보
sonar.projectKey=jaeyoung0207_content-hub
sonar.organization=jaeyoung0207
sonar.host.url=https://sonarcloud.io

# 분석 대상 소스 및 테스트 경로
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# 결과물 제외 대상
sonar.exclusions=**/node_modules/**, **/dist/**, **/*.d.ts, src/api/**, **/stats.html

# 테스트 커버리지 리포트 경로 (Vitest lcov 설정과 일치해야 함)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
