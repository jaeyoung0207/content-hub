server {
    listen 80;
    server_name content-hub.info www.content-hub.info;

    # Let's Encrypt 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 영구 리다이렉트
    rewrite ^ https://$host$request_uri? permanent;
}

server {
    # 443 포트를 SSL로 수신
    listen 443 ssl;
    server_name content-hub.info www.content-hub.info;

    # SSL 인증서 경로
    ssl_certificate     /etc/letsencrypt/live/content-hub.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/content-hub.info/privkey.pem;
	# 사용 프로토콜
	ssl_protocols       TLSv1.2 TLSv1.3;
	# 암호화 방식
    ssl_ciphers         HIGH:!aNULL:!MD5;
	# 서버(Nginx)가 선호하는 암호화 방식을 사용
	ssl_prefer_server_ciphers on;
	# "SSL" 공유 메모리 공간 할당
    ssl_session_cache   shared:SSL:10m;
	# 캐시된 SSL 세션 정보 유효 기간 설정
    ssl_session_timeout 1h;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # React 정적 파일
    root /usr/share/nginx/html;
    index index.html;
	
	# 정적 자산은 404 반환
	location /assets/ {
        try_files $uri =404;
    }
    location ~* \.(js|css|map|json|png|jpg|jpeg|gif|svg|webp|ico)$ {
        try_files $uri =404;
    }

    # 프론트 라우팅 해결 (SPA)
    location / {
        try_files $uri /index.html;
    }

    # 백엔드 API 프록시
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Actuator health 프록시 (내부 관리 용도로만)
    location /_internal/health {
        proxy_pass http://backend:8081/actuator/health;
        proxy_set_header Host $host;
    }
}
