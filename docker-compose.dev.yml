version: '3.9'

services:
  # ===========================
  # PostgreSQL
  # ===========================
  db:
    image: postgres:17
    env_file:
      - ./backend/env/.env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  # ===========================
  # Redis
  # ===========================
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  # ===========================
  # Backend (Spring Boot)
  # ===========================
  backend:
    build: ./backend/content-hub-backend/content-hub
    container_name: backend
    env_file:
      - ./backend/env/.env.dev
    ports:
      - "8080:8080" # 편의상 호스트에서 직접 확인하려면 열기
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===========================
  # Frontend
  # ===========================
  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend/content-hub-frontend:/app
      - /app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: